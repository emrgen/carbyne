[package]
name = "carbyne-blocks"
version.workspace = true
edition.workspace = true

[dependencies]
carbyne = { path = "../carbyne" }
rusqlite = { version = "0.31", features = ["bundled"] }
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
zstd = "0.13"
dashmap = "5.5"
bincode = "1.3"
