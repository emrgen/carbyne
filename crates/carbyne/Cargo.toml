[package]
name = "carbyne"
version.workspace = true
edition.workspace = true

[features]
default = ["uuid-client"]
uuid-client = []
# scaffolding for alternate client-id backends, never enabled by default;
# declared so #[cfg(feature = "...")] in id.rs doesn't trip unexpected_cfgs
string-client = []
u64-client = []
# scaffolding for an alternate Fugue-based list insertion algorithm in
# nlist.rs, never enabled by default; declared for the same reason.
fugue = []

[dependencies]
bimap = "0.6.3"
log = "0.4.21"
serde = { version = "1.0.203", features = ["derive"] }
indexmap = { version = "2.2.6", features = ["serde"] }
bitflags = "2.5.0"
miniz_oxide = "0.7.4"
fake = { version = "2.9.2", features = ["derive"] }
rand = "0.8.5"
fractional_index = "2.0.0"
rand_chacha = "0.3.1"
btree-slab = "0.6.1"
skiplist = "0.5.1"
ptree = "0.5.2"
serde_columnar = { version = "0.3.2", features = ["bench"] }
hashbrown = { version = "0.11.2", features = ["serde"] }
ahash = "0.7.8"
queues = "1.1.0"
sha1 = "0.10.6"
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.8.0", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "text_operations"
harness = false

[[bench]]
name = "realistic_workloads"
harness = false

[[bench]]
name = "large_document"
harness = false

[[bench]]
name = "realistic_edits"
harness = false

[[bench]]
name = "notion_like_blocks"
harness = false

[[bench]]
name = "block_tree_dirty_tracking"
harness = false

[[bench]]
name = "block_dirty_tracking"
harness = false

[[bench]]
name = "10k_docs_benchmark"
harness = false
