[package]
name = "carbyne-db"
version.workspace = true
edition.workspace = true

[dependencies]
carbyne = { path = "../carbyne" }
uuid = { version = "1.8", features = ["v4", "serde"] }
rocksdb = "0.21"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
